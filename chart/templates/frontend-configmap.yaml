{{- if and .Values.frontend.enabled .Values.webUI.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "provenance-collector.fullname" . }}-frontend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "provenance-collector.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  # Served by nginx at /config.json (mounted over the copy baked into the image).
  # The SPA fetches it at startup, so Keycloak settings and branding change
  # without rebuilding the image. clientId defaults to the nebari-operator
  # SPA-client convention (<namespace>-<nebariapp-name>-spa); the NebariApp for
  # this pack is named "<fullname>", so the SPA client is
  # "<namespace>-<fullname>-spa".
  #
  # "mode": "provenance" tells the SPA that only this pack's dashboard is behind
  # /api/, so it skips its startup backend probe (GET /api/v1/summary). The same
  # image also runs in front of the Security Posture pack's API, which is what
  # the probe is for.
  #
  # Branding fields are rendered as-is (empty strings / empty maps by default)
  # and the SPA falls back to the built-in Nebari defaults per field, so an
  # unbranded install is unchanged.
  config.json: |
    {
      "mode": "provenance",
      "provenanceApiBase": "/api",
      "keycloak": {
        "url":      {{ required "frontend.keycloak.url is required when frontend.enabled=true" .Values.frontend.keycloak.url | quote }},
        "realm":    {{ .Values.frontend.keycloak.realm | quote }},
        "clientId": {{ default (printf "%s-%s-spa" .Release.Namespace (include "provenance-collector.fullname" .)) .Values.frontend.keycloak.clientId | quote }}
      },
      "title":       {{ .Values.frontend.title | quote }},
      "logoUrl":     {{ .Values.frontend.branding.logoUrl | quote }},
      "logoUrlDark": {{ .Values.frontend.branding.logoUrlDark | quote }},
      "faviconUrl":  {{ .Values.frontend.branding.faviconUrl | quote }},
      "theme":       {{ .Values.frontend.branding.theme | toJson }}
    }
{{- end }}
