apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: provenance-collector
  namespace: argocd
spec:
  # Software packs must run under the `nebari-apps` project. As of NIC v0.10.0
  # the `default` project is deny-all (empty sourceRepos + resource whitelists),
  # so an Application on `default` never renders and sits at Unknown/Unknown.
  # `nebari-apps` permits the file:// gitops source and all resource kinds.
  project: nebari-apps
  source:
    repoURL: "file://${GITOPS_DIR}"
    targetRevision: HEAD
    path: provenance-collector
    helm:
      releaseName: provenance-test
      valuesObject:
        images:
          api: { repository: security-posture-api, tag: test, pullPolicy: Never }
          worker: { repository: security-posture-worker, tag: test, pullPolicy: Never }
          ui: { repository: security-posture-ui, tag: test, pullPolicy: Never }
        # The sandbox has no gateway login in front of the test client; the
        # API is reached by port-forward. Development/CI only.
        auth:
          mode: disabled
        scanner:
          parallelism: 2
          # Clair needs ~2 GiB and a long first update; trivy + grype suffice here.
          clair:
            enabled: false
          mirror:
            enabled: false
        provenance:
          engine: collector
          verifySignatures: false
          checkUpdates: false
          helmReleases:
            enabled: true
          compat:
            internalService:
              enabled: true
              allowedNamespaces: [default]
        controlsEngine:
          enabled: false
        networkPolicy:
          enabled: false
        persistence:
          worker: 5Gi
          trivy: 2Gi
          postgres: 2Gi
        nebariapp:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
