name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: collector
        env:
          GOTOOLCHAIN: auto

      # configspec drift guards. checkenvs fails if any os.Getenv (or a name
      # passed to one of the config helpers) references a PROVENANCE_* /
      # KUBECONFIG name that isn't in internal/configspec.Vars. gendocs --check
      # fails if docs/src/content/docs/collector-environment.md is stale
      # relative to the spec. Together they keep the docs and the code from
      # drifting.
      - name: Verify configspec coverage
        run: go run ./hack/checkenvs

      - name: Verify collector-environment.md is up to date
        run: go run ./hack/gendocs --check

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | \
            sudo tar -xz -C /usr/local/bin kubeconform

      - name: Build chart dependencies
        run: helm dependency build chart/

      - name: Lint chart
        run: |
          helm lint chart/
          helm lint chart/ -f deploy/grace/values.yaml
          helm lint chart/ -f examples/nebari-values.yaml
          helm lint chart/ -f examples/standalone-values.yaml

      - name: Template (NebariApp disabled, defaults)
        run: |
          helm template test chart/ --set nebariapp.enabled=false > /tmp/disabled.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/disabled.yaml

      - name: Template (NebariApp enabled)
        run: |
          helm template test chart/ --set nebariapp.enabled=true \
            --set nebariapp.hostname=test.example.com > /tmp/enabled.yaml
          grep -q 'kind: NebariApp' /tmp/enabled.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/enabled.yaml

      - name: Template (chart-rendered SecurityPolicy)
        run: |
          helm template test chart/ --set nebariapp.enabled=true \
            --set nebariapp.hostname=test.example.com \
            --set adminGate.securityPolicy.enabled=true \
            --set adminGate.securityPolicy.externalIssuer=https://keycloak.example.com/auth/realms/nebari > /tmp/sp.yaml
          grep -q 'kind: SecurityPolicy' /tmp/sp.yaml
          grep -q 'enforceAtGateway: false' /tmp/sp.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/sp.yaml

      - name: Template (external database, no bundled scanners)
        run: |
          helm template test chart/ --set postgresql.enabled=false \
            --set externalDatabase.host=db.example.com \
            --set externalDatabase.existingSecret=db-creds \
            --set scanner.clair.enabled=false --set scanner.trivy.enabled=false \
            | kubeconform -strict -ignore-missing-schemas -summary

      - name: Template (grace and example values)
        run: |
          helm template security-posture chart/ -n security-posture \
            -f deploy/grace/values.yaml | kubeconform -strict -ignore-missing-schemas -summary
          for f in examples/nebari-values.yaml examples/standalone-values.yaml; do
            helm template provenance-collector chart/ -n provenance-system -f "$f" \
              | kubeconform -strict -ignore-missing-schemas -summary
          done

      # provenance-collector-pack <= 0.1.x values (chart/templates/_compat.tpl):
      # config.* are aliases, retired keys fail with a pointer.
      - name: Values compatibility
        run: |
          set -euo pipefail
          out=$(helm template t chart/ --set config.verifySignatures=false --set config.helmEnabled=true \
            --set config.registryTimeout=1m --set config.clusterName=legacy)
          grep -A1 'name: PROVENANCE_VERIFY_SIGNATURES' <<<"$out" | grep -q '"false"'
          grep -A1 'name: PROVENANCE_REGISTRY_TIMEOUT' <<<"$out" | grep -q '"60"'
          grep -A1 'name: CLUSTER_NAME' <<<"$out" | grep -q '"legacy"'
          grep -q -- '-helm-releases' <<<"$out"
          for bad in "schedule=0 6 * * *" "persistence.mode=http" "frontend.keycloak.url=https://kc" "config.namespaces[0]=a"; do
            if helm template t chart/ --set "$bad" >/dev/null 2>/tmp/err; then
              echo "expected '$bad' to fail the render"; exit 1
            fi
            grep -q "provenance-collector-pack <= 0.1.x\|not supported" /tmp/err
          done

  ui-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck deploy scripts
        run: shellcheck deploy/grace/*.sh
