name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Coverage floors live in frontend/vitest.config.ts (thresholds); the run
      # fails if any of them drops.
      - name: Vitest (with coverage gate)
        run: npm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total; console.log('### Frontend coverage: lines ' + t.lines.pct + '%, statements ' + t.statements.pct + '%, branches ' + t.branches.pct + '%, functions ' + t.functions.pct + '%')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-summary.json
          retention-days: 14

      - name: Build
        run: npm run build

  # Playwright against the mock bundles (MSW in the browser, no cluster):
  # provenance.spec.ts runs on the VITE_API_MOCK=provenance bundle, an MSW copy
  # of the Go dashboard serving the golden report; the other specs smoke-test
  # the full Security Posture mode the same image also serves. The dashboard
  # e2e against a real cluster lives in test/e2e (Integration Test workflow).
  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble # matches @playwright/test in frontend/package.json
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci

      - name: Build the mock bundles
        run: npm run build:mock-preview

      - name: Playwright
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
