name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  collector:
    name: collector (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: collector/coverage.out

  api:
    name: api (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: posture
          POSTGRES_PASSWORD: posture
          POSTGRES_DB: posture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U posture" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CONTROLS_ENGINE_ENABLED: "false"
      TEST_DATABASE_URL: postgresql://posture:posture@localhost:5432/posture_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test (unit + Postgres integration)
        run: pytest -q

  ui:
    name: ui (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Vitest
        run: npm test
      - name: Build (tsc + vite)
        run: npm run build
