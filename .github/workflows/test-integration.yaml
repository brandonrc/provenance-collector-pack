name: Integration Test

# Deploys the merged chart (api, worker with the bundled Go collector, ui,
# Postgres, Trivy) into a NIC sandbox through ArgoCD, runs one scan and checks
# that the provenance engine ingested the collector's report and that the
# provenance-collector report API (/api/reports/latest) still answers on the
# unauthenticated compat Service, exactly as Grafana reads it.

on:
  # Manual trigger — run the full integration suite against any branch.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "collector/**"
      - "api/**"
      - "ui/**"
      - "chart/**"
      - ".github/workflows/test-integration.yaml"
      - ".github/argo-apps/provenance-collector.yaml"

permissions:
  contents: read

env:
  FULLNAME: provenance-test-provenance-collector

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Nebari sandbox
        id: sandbox
        uses: nebari-dev/action-nebari-sandbox@9ac369ebf87ac2ae217504dcbf824c77f70e429a # v3.0.0
        with:
          # Pinned rather than tracking `latest`, so a NIC release cannot turn
          # this job red without a deliberate bump.
          nic-version: v0.13.0
          cluster-name: provenance-test
          resource-summary: "true"

      - name: Configure kubeconfig
        run: echo "KUBECONFIG=${{ steps.sandbox.outputs.kubeconfig }}" >> "$GITHUB_ENV"

      - name: Build and load images
        run: |
          set -euo pipefail
          docker build -f api/Dockerfile.api -t security-posture-api:test api
          docker build -f api/Dockerfile.worker --build-arg COLLECTOR_VERSION=test -t security-posture-worker:test .
          docker build -f ui/Dockerfile -t security-posture-ui:test ui
          for img in api worker ui; do
            kind load docker-image "security-posture-${img}:test" --name ${{ steps.sandbox.outputs.cluster-name }}
          done

      - name: Register the pack
        uses: nebari-dev/action-nebari-sandbox/add-software-pack@9ac369ebf87ac2ae217504dcbf824c77f70e429a # v3.0.0
        with:
          gitops-dir: ${{ steps.sandbox.outputs.gitops-dir }}
          app-name: provenance-collector
          chart-source: ./chart
          application-manifest: .github/argo-apps/provenance-collector.yaml

      # ArgoCD aggregates an Application with zero live resources to Healthy, so
      # wait for the chart's objects to exist before waiting on conditions
      # (`kubectl wait` exits NotFound immediately on a missing object).
      - name: Wait for the chart's objects to sync
        run: |
          for obj in deployment/${FULLNAME}-api deployment/${FULLNAME}-worker deployment/${FULLNAME}-ui; do
            for i in $(seq 1 90); do
              kubectl get "$obj" >/dev/null 2>&1 && { echo "$obj exists"; break; }
              if [ "$i" -eq 90 ]; then
                kubectl get application/provenance-collector -n argocd \
                  -o custom-columns='SYNC:.status.sync.status,HEALTH:.status.health.status'
                kubectl get all
                exit 1
              fi
              sleep 5
            done
          done

      - name: Wait for api, worker and ui
        run: |
          kubectl wait --for=condition=available deployment/${FULLNAME}-api --timeout=600s
          kubectl wait --for=condition=available deployment/${FULLNAME}-ui --timeout=300s
          # The worker becomes ready once its scanner databases are in place.
          kubectl wait --for=condition=available deployment/${FULLNAME}-worker --timeout=1200s

      - name: Run a scan
        run: |
          set -euo pipefail
          kubectl port-forward svc/${FULLNAME}-api 8000:8000 > /tmp/pf-api.log 2>&1 &
          sleep 3
          # 202 {id} for a new scan, 409 {scanId} when the worker's start-up scan is running.
          ID=$(curl -s -XPOST localhost:8000/api/v1/scans -H 'content-type: application/json' -d '{"force": true}' | jq -r '.id // .scanId')
          echo "scan id: ${ID}"
          for i in $(seq 1 120); do
            STATUS=$(curl -sf "localhost:8000/api/v1/scans/${ID}" | jq -r .status)
            echo "attempt $i: ${STATUS}"
            case "${STATUS}" in done) break ;; failed|cancelled) exit 1 ;; esac
            sleep 15
          done
          SCAN=$(curl -sf "localhost:8000/api/v1/scans/${ID}")
          echo "${SCAN}" | jq -r '.log[]'
          echo "${SCAN}" | jq -e '.status == "done"' > /dev/null
          # The Go collector ran and its report was ingested.
          echo "${SCAN}" | jq -e '[.log[] | select(test("provenance engine=collector \\(test\\)"))] | length > 0' > /dev/null
          echo "${SCAN}" | jq -e '[.log[] | select(test("engine=collector failed"))] | length == 0' > /dev/null

      - name: Verify the provenance report API (Grafana path)
        run: |
          set -euo pipefail
          kubectl port-forward svc/${FULLNAME}-web-internal 8080:8080 > /tmp/pf-compat.log 2>&1 &
          sleep 3
          REPORT=$(curl -sf http://localhost:8080/api/reports/latest)
          echo "$REPORT" | jq .summary
          echo "$REPORT" | jq -e '.metadata.generatedAt' > /dev/null
          echo "$REPORT" | jq -e '.summary.totalImages > 0' > /dev/null
          echo "$REPORT" | jq -e '.images | length > 0' > /dev/null
          curl -sf http://localhost:8080/api/reports | jq -e 'length >= 1' > /dev/null
          curl -sf "http://localhost:8080/api/export?format=csv" | head -3
          echo "Integration test passed!"

      - name: Debug info on failure
        if: failure()
        run: |
          kubectl get applications -n argocd \
            -o custom-columns='NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status' || true
          kubectl get pods -A
          for c in api worker ui; do
            echo "=== ${c} logs ==="
            kubectl logs deployment/${FULLNAME}-${c} --all-containers --tail=200 || true
          done
          kubectl get events --sort-by=.lastTimestamp | tail -40
