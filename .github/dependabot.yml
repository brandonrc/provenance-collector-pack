version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    groups:
      # vite, its plugins, and vitest are locked together by peer ranges
      # (@vitejs/plugin-react and @tailwindcss/vite pin a vite major, and
      # @vitest/coverage-v8 must match vitest exactly), so a lone bump can't
      # install. Group them with majors included so the toolchain moves as one.
      vite-toolchain:
        applies-to: version-updates
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
          - "@tailwindcss/vite"
      # Group all remaining patch and minor updates into a single PR
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Other major updates are not grouped, so each opens its own PR
    ignore:
      # Stay on @types/node 24.x to match the Node 24 runtime target.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # TypeScript 7 drops `baseUrl` and non-relative path mappings, both of
      # which tsconfig.app.json relies on. Upgrade deliberately, not via a bot.
      - dependency-name: "typescript"
        versions: [">=7"]
      # The vendored Nebari design-system components (src/components/ui) are
      # tested against @base-ui/react 1.6; 1.8 changes the toast types. Move it
      # together with a registry update, not on its own.
      - dependency-name: "@base-ui/react"
        versions: [">=1.7"]
      # Pinned to the mcr.microsoft.com/playwright image tag the frontend-e2e
      # job runs in (.github/workflows/test.yaml); bump both together.
      - dependency-name: "@playwright/test"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    groups:
      # Group all patch and minor updates into a single PR
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Major updates are not grouped, so each opens its own PR

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "US/Eastern"
    groups:
      # Group all GitHub Actions updates into a single PR
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
