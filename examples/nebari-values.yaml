# Nebari deployment — requires the nebari-operator, Envoy Gateway and Keycloak.
#
# The target namespace must have the label:
#   nebari.dev/managed=true
#
# Deploy with:
#   helm dependency build chart/
#   helm install provenance-collector chart/ \
#     -f examples/nebari-values.yaml \
#     --namespace provenance-system --create-namespace
#
# Migrating from provenance-collector-pack <= 0.1.x: see
# docs/src/content/docs/migrating.md. `schedule`, `persistence.mode` and
# `frontend.keycloak.url` are retired (the render fails with a pointer);
# `config.*` keys are still accepted as aliases of `provenance.*`.

clusterName: ""  # Set to your cluster name (report metadata).

# Keycloak groups allowed to use the pack (gateway + API). The UI and every
# API route, including /api/reports*, are admin-only.
adminGroups:
  - admin

auth:
  mode: oidc
  # Accepted token issuers: the public realm URL the browser sees and the
  # in-cluster one. Required: an empty list rejects every token.
  issuers:
    - https://keycloak.example.com/auth/realms/nebari  # Replace.
    - http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/nebari

scanner:
  # Was `schedule: "0 6 * * *"` (daily CronJob).
  intervalHours: 24
  # Was config.excludeNamespaces.
  excludedNamespaces: []

# Supply-chain provenance (was config.*). The worker runs the Go
# provenance-collector once per scan and ingests its report.
provenance:
  engine: collector
  verifySignatures: true
  checkSBOM: true
  checkProvenance: true
  checkUpdates: true
  updateLevel: patch
  helmReleases:
    # Was config.helmEnabled (default true there). Grants cluster-wide Secrets
    # get/list to the worker's ServiceAccount.
    enabled: true
  compat:
    internalService:
      # Unauthenticated /api/reports* for Grafana (examples/grafana-dashboard.json):
      #   http://provenance-collector-web-internal.provenance-system.svc:8080/api/reports/latest
      enabled: true
      allowedNamespaces:
        - monitoring

persistence:
  storageClass: ""  # "" = cluster default.

# Register with the nebari-operator and expose the UI through the gateway.
# The compat Service (<fullname>-web-internal) is never routed by the gateway.
nebariapp:
  enabled: true
  hostname: provenance.example.com  # Replace with your hostname.
  landingPage:
    enabled: true
    displayName: Security Posture
