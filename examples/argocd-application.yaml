# ArgoCD Application for deploying the Security Posture pack (chart
# provenance-collector) from the Nebari Helm repository. Update repoURL and
# targetRevision once the chart is published.
#
# The target namespace must have the label:
#   nebari.dev/managed=true
# if nebariapp.enabled is true.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: provenance-collector
  namespace: argocd
spec:
  # Software packs run under the `nebari-apps` project on NIC >= v0.10.0.
  project: nebari-apps
  source:
    repoURL: https://nebari-dev.github.io/helm-repository
    chart: provenance-collector
    targetRevision: "0.2.0"  # Pin to a released version.
    helm:
      valuesObject:
        clusterName: my-cluster
        adminGroups:
          - admin
        auth:
          issuers:
            - https://keycloak.example.com/auth/realms/nebari
            - http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/nebari
        scanner:
          intervalHours: 24
        provenance:
          verifySignatures: true
          checkUpdates: true
          helmReleases:
            enabled: true
          compat:
            internalService:
              enabled: true

        nebariapp:
          enabled: true
          hostname: provenance.example.com  # Replace with your hostname.
          landingPage:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: provenance-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
