# Standalone deployment — no nebari-operator, gateway or Keycloak required.
#
# Deploy with:
#   helm dependency build chart/
#   helm install provenance-collector chart/ \
#     -f examples/standalone-values.yaml \
#     --namespace provenance-system --create-namespace
# Then:
#   kubectl port-forward -n provenance-system svc/provenance-collector-ui 8080:80
#   open http://localhost:8080
#
# WARNING: auth.mode=disabled means the API performs NO authentication: anyone
# who can reach the ui Service is an admin. Keep it on a trusted network or
# put your own authenticating proxy in front and use auth.mode=oidc.

clusterName: my-cluster

auth:
  mode: disabled

scanner:
  intervalHours: 24
  excludedNamespaces: []
  # No in-cluster registry to mirror into: scan images in place.
  mirror:
    enabled: false

provenance:
  engine: collector
  verifySignatures: true
  checkUpdates: true
  helmReleases:
    enabled: true
  compat:
    internalService:
      enabled: true
      allowedNamespaces:
        - monitoring

networkPolicy:
  # The default policy only admits the gateway namespace to the ui.
  enabled: false

nebariapp:
  enabled: false
